name: Translate README

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Adding README translations
        uses: ikhsan3adi/markdown-translator@v2.5.1
        with:
          LANG: zh-CN
          FILES: |-
            README.md
